name: recipe-worker

# Drains the Supabase recipe_jobs queue (video + link-in-bio) on GitHub's runners.
# Public repo => unlimited free Actions minutes. ffmpeg is apt-installed below (NOT preinstalled).
on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub's minimum)
  workflow_dispatch: {} # manual / on-demand run

concurrency:
  group: recipe-worker # never run two drains at once
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Drain the queue
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          WORKER_RUN_ONCE: '1'
          WORKER_KINDS: link_in_bio,video,cover # video via Apify's direct URL; cover = backfill a caption reel's image via Apify
          FFMPEG_PATH: ffmpeg # from the apt-get install step above
        run: node worker/index.mjs
