name: recipe-worker

# Drains the Supabase recipe_jobs queue (video + link-in-bio) on GitHub's runners.
# Public repo => unlimited free Actions minutes. ffmpeg is apt-installed below (NOT preinstalled).
on:
  schedule:
    # SAFETY NET ONLY — real imports dispatch instantly via the recipe_jobs
    # insert trigger (pg_net -> workflow_dispatch). Ran every 5 min originally;
    # relaxed to 15 because each tick competes for a free-tier runner, and a
    # tick that never gets one occupies the concurrency slot until it times out.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # manual / on-demand run

concurrency:
  group: recipe-worker # never run two drains at once
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # Bounds how long a wedged or runner-starved run can hold the concurrency
    # slot (a real user import dispatched behind it waits this long). Still
    # comfortably above a full video job: Apify + download + transcribe + vision.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Drain the queue
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Service role so one worker drains every user's queue (RLS-scoped it
          # would only see the owner's rows). Bypasses RLS — never client-side.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # APNs push (token-based). The .p8 contents, its Key ID, and the Team ID.
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          WORKER_RUN_ONCE: '1'
          WORKER_KINDS: link_in_bio,video,cover # video via Apify's direct URL; cover = backfill a caption reel's image via Apify
          FFMPEG_PATH: ffmpeg # from the apt-get install step above
        run: node worker/index.mjs
