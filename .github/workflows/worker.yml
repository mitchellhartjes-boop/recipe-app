name: recipe-worker

# Drains the Supabase recipe_jobs queue (video + link-in-bio) on GitHub's runners.
# Public repo => unlimited free Actions minutes. ffmpeg is apt-installed below (NOT preinstalled).
on:
  schedule:
    # SAFETY NET ONLY — real imports dispatch instantly via the recipe_jobs
    # insert trigger (pg_net -> workflow_dispatch). Ran every 5 min originally;
    # relaxed to 15 because each tick competes for a free-tier runner, and a
    # tick that never gets one occupies the concurrency slot until it times out.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # manual / on-demand run

concurrency:
  group: recipe-worker # never run two drains at once
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # Bounds how long a wedged or runner-starved run can hold the concurrency
    # slot (a real user import dispatched behind it waits this long). Still
    # comfortably above a full video job: Apify + download + transcribe + vision.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Install ffmpeg
        # apt pulled ~100 packages from Ubuntu's mirrors, and on a slow-mirror
        # day that crawled past the job's 10-minute limit: three runs in a day
        # were killed mid-install before they reached the queue (2026-10-22/23),
        # leaving a user's shared reel stuck on "Extracting" for an hour.
        # One static build from GitHub's own release CDN is a single download
        # on the runner's own network. apt stays as the fallback, with network
        # timeouts so it fails instead of crawling, and this step has its own
        # time limit so a hang can never eat the whole job's budget again.
        timeout-minutes: 4
        run: |
          set -euo pipefail
          URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$HOME/ffmpeg"
          if curl -fsSL --retry 3 --retry-delay 5 --max-time 150 "$URL" -o /tmp/ffmpeg.tar.xz \
             && tar -xJf /tmp/ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=2 --wildcards '*/bin/ffmpeg'; then
            echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
            "$HOME/ffmpeg/ffmpeg" -hide_banner -version | head -1
          else
            echo "::warning::static ffmpeg download failed - falling back to apt"
            APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20'
            sudo apt-get $APT update
            sudo apt-get $APT install -y --no-install-recommends ffmpeg
            ffmpeg -hide_banner -version | head -1
          fi
      - name: Drain the queue
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Service role so one worker drains every user's queue (RLS-scoped it
          # would only see the owner's rows). Bypasses RLS — never client-side.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # APNs push (token-based). The .p8 contents, its Key ID, and the Team ID.
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          WORKER_RUN_ONCE: '1'
          WORKER_KINDS: link_in_bio,video,cover,web # video via Apify's direct URL; cover = backfill a caption reel's image via Apify; web = publishers that refuse our datacenter IP
          FFMPEG_PATH: ffmpeg # on PATH from the Install ffmpeg step above
        run: node worker/index.mjs
