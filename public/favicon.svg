  <!-- griddle toast spots -->
  <g fill="#d98b35">
    <circle cx="29" cy="27" r="1.9"/>
    <circle cx="37.5" cy="33" r="1.5"/>
    <circle cx="30" cy="36" r="1.3"/>
  </g>
</svg>
