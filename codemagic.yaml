# Codemagic: build the iOS app from this repo — no Mac required.
#
# Adapted from the Sounder (fishing app) pipeline, which is already proven on
# this Apple Developer account. Differences: Vite instead of Next.js static
# export, webDir dist/, and VITE_API_BASE instead of NEXT_PUBLIC_API_BASE.
#
# One-time setup in the Codemagic UI:
#   1. Connect this GitHub repo.
#   2. Teams > Integrations > App Store Connect: add an API key (App Manager
#      role). The Sounder key can be reused, or add one named "dilla-asc".
#   3. Create an environment group "dilla" with:
#        VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   (publishable — safe)
#        CERT_KEY_B64   (single-line base64 of the signing RSA key)
#   4. In App Store Connect, create the app record with the bundle id below.
#
# ⚠️ CERT_KEY_B64 must be SINGLE-LINE base64. A multiline PEM pasted into an env
#    var does not survive — this cost a debugging cycle on Sounder; don't repeat it.
#
# Every push to main builds, signs, and uploads to TestFlight.

workflows:
  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: dilla-asc
    environment:
      groups:
        - dilla
      vars:
        VITE_API_BASE: "https://recipe-vault-mh.netlify.app"
        BUNDLE_ID: "com.mitchellhartjes.dilla"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.14.0 # Capacitor CLI requires Node >= 22
      xcode: latest # must be Xcode 26+ / iOS 26 SDK for App Store submission
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build the web app for native
        script: npm run build:native
      - name: Sync Capacitor iOS
        script: |
          set -e
          npx cap sync ios
          # `cap sync` can rewrite project.pbxproj, so the Share Extension
          # target is (re)applied after it. The script is idempotent.
          node scripts/add-share-extension.mjs
          # Regenerate the native app icon. Capacitor ships a blue placeholder
          # and restores it whenever ios/ is recreated; generating it here means
          # the build can never ship the wrong icon regardless of repo state.
          node scripts/gen-icons.mjs
      - name: Fetch signing files
        script: |
          # -e so a signing failure fails THIS step loudly. Without it the step
          # "succeeds" in ~1s and the build dies much later at archive with the
          # confusing "requires a provisioning profile" error.
          set -e
          keychain initialize

          if [ -z "$CERT_KEY_B64" ]; then
            echo "CERT_KEY_B64 is empty — add it to the 'dilla' environment group."
            echo "Generate with:"
            echo "  openssl genrsa -out ios_distribution_key.pem 2048"
            echo "  openssl base64 -A -in ios_distribution_key.pem   # -A = ONE line"
            exit 1
          fi

          # base64 survives any paste; a multiline PEM in an env var does not.
          echo "$CERT_KEY_B64" | base64 --decode > /tmp/cert_key
          head -c 32 /tmp/cert_key | grep -q "BEGIN" || {
            echo "Decoded CERT_KEY_B64 is not a PEM key — re-copy it as a single line (openssl base64 -A)."
            exit 1
          }

          # The Share Extension is a SECOND app id and needs its own profile.
          # Both must be registered in the Apple Developer account first, and
          # BOTH need the App Groups capability enabled on the App ID.
          #
          # --profile-type is fetched fresh each build. If a profile was created
          # BEFORE a capability (e.g. App Groups) was added to the App ID, Apple
          # keeps serving that stale profile and the export then fails with
          # 'requires a provisioning profile with the App Groups feature'.
          # Deleting the old profiles in the portal forces a correct one.
          for ID in "$BUNDLE_ID" "$BUNDLE_ID.ShareExtension"; do
            echo "--- fetching signing files for $ID"
            app-store-connect fetch-signing-files "$ID" \
              --type IOS_APP_STORE --create \
              --certificate-key=@file:/tmp/cert_key
          done

          # Profiles land in Xcode's UserData directory, not the old
          # ~/Library/MobileDevice path — globbing the wrong one printed nothing.
          echo "--- capabilities in the fetched profiles ---"
          for p in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$p" ] || continue
            DECODED=$(security cms -D -i "$p" 2>/dev/null)
            NAME=$(printf '%s' "$DECODED" | plutil -extract Name raw - 2>/dev/null)
            HAS_GROUPS=$(printf '%s' "$DECODED" | grep -c "application-groups" || true)
            echo "  $NAME | app-groups entitlement present: $HAS_GROUPS"
          done

          keychain add-certificates

          # Writes the fetched profile + team into the Xcode project. The
          # Capacitor template ships with DEVELOPMENT_TEAM empty and
          # CODE_SIGN_IDENTITY "iPhone Developer" (a *development* identity),
          # neither of which can archive for the App Store — this fixes both.
          # ...and writes the bundle-id -> profile mapping that -exportArchive
          # needs. Without that mapping the export cannot tell which profile
          # belongs to the app vs the extension, and fails claiming the profile
          # lacks a capability it actually has.
          # No flag here on purpose: `use-profiles` writes its export options to
          # ~/export_options.plist by default, and that file carries the
          # bundle-id -> profile mapping the export step needs. Passing an
          # explicit path means guessing the flag name; the default is documented.
          xcode-project use-profiles

          echo "--- generated export options (bundle id -> profile) ---"
          cat "$HOME/export_options.plist" 2>/dev/null || echo "NONE — use-profiles produced no export options"
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          set -e
          # `xcode-project build-ipa` summarises xcodebuild's output and can
          # swallow the actual diagnostic, leaving only "Failed to archive".
          # Run xcodebuild directly first so the real error is in the log; if it
          # passes, hand the archive to build-ipa for packaging.
          # Export into the repo working directory, NOT $CM_BUILD_DIR. The
          # artifact patterns below are resolved relative to the clone root, so
          # an absolute path there silently matches nothing — which makes the
          # publish step "succeed" while uploading no IPA at all.
          ARCHIVE="$CM_BUILD_DIR/ios/xcarchive/App.xcarchive"
          IPA_DIR="build/ios/ipa"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -archivePath "$ARCHIVE" archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            -allowProvisioningUpdates \
            2>&1 | tee /tmp/archive.log | xcpretty --no-color || {
              echo ""
              echo "=================== ARCHIVE FAILED — real errors ==================="
              grep -E "error:|warning: .*(entitl|provision|signing)|Provisioning|entitlement|No profile|does not match" /tmp/archive.log | head -40
              echo "==================== last 60 lines of raw log ======================"
              tail -60 /tmp/archive.log
              exit 1
            }

          # Export using the options plist that `use-profiles` generated in the
          # signing step. It carries the bundle-id -> provisioning-profile map
          # for BOTH the app and the extension. Hand-writing this plist was the
          # bug: without the mapping, exportArchive can't match a profile to a
          # bundle id and reports the profile as missing a capability it has.
          EXPORT_OPTS="$HOME/export_options.plist"
          if [ ! -f "$EXPORT_OPTS" ]; then
            echo "No export options at $EXPORT_OPTS — use-profiles did not run correctly."
            exit 1
          fi
          echo "--- exporting with ---"
          cat "$EXPORT_OPTS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$IPA_DIR" \
            -exportOptionsPlist "$EXPORT_OPTS" \
            -allowProvisioningUpdates \
            2>&1 | tee /tmp/export.log | xcpretty --no-color || {
              echo ""
              echo "=================== EXPORT FAILED — real errors ==================="
              grep -E "error:|Provisioning|entitlement|No profile|does not match" /tmp/export.log | head -30
              echo "==================== last 40 lines of raw log ====================="
              tail -40 /tmp/export.log
              exit 1
            }

          # Fail loudly if no IPA was produced. Without this the build goes green
          # and TestFlight silently gets nothing — which is exactly what happened.
          echo "--- exported files in $IPA_DIR ---"
          ls -la "$IPA_DIR" || true
          if ! ls "$IPA_DIR"/*.ipa >/dev/null 2>&1; then
            echo "No .ipa produced in $IPA_DIR — nothing would be uploaded to TestFlight."
            exit 1
          fi
          echo "IPA ready: $(ls "$IPA_DIR"/*.ipa)"
    artifacts:
      # Relative to the clone root — must match IPA_DIR in the Build IPA step.
      - build/ios/ipa/*.ipa
      - /tmp/archive.log
      - /tmp/export.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
