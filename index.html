<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale=1 + user-scalable=no lock the WebView to 1.0 scale. Without
         them, a cold-start WKWebView (fresh install) sometimes computes its
         layout width before its bounds settle and comes up ZOOMED IN — content
         magnified, panning sideways — then corrects itself on the next launch
         once the WebView is warm. Locking the scale stops it ever settling >1.
         (Native app only respects these; mobile Safari ignores user-scalable,
         which is fine — Safari doesn't have the cold-start bug.) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dilla" />
    <script>
      // Apply the saved (or system) theme before first paint — no flash of light.
      (function () {
        try {
          var t = localStorage.getItem('wedge-theme')
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.content = dark ? '#1b1714' : '#faf8f5'
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Dilla — Save recipes from TikTok, Instagram &amp; Pinterest, written out properly</title>
    <meta
      name="description"
      content="Share a reel, get the recipe. Dilla writes down the recipes you save on TikTok, Instagram, and Pinterest — even when they're only spoken in the video."
    />
    <meta property="og:title" content="Dilla — Share a reel. Get the recipe." />
    <meta
      property="og:description"
      content="Dilla writes down the recipes you save on TikTok, Instagram, and Pinterest — even when they're only spoken in the video."
    />
    <meta property="og:image" content="https://recipe-vault-mh.netlify.app/press/assets/screenshots/01-share-story.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms needs a static form at deploy time; the Landing page
         POSTs to it. Hidden — never rendered as UI. -->
    <form name="launch-updates" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
